<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="하늘과 땅을 흔드는 기도 · 6일 말씀 묵상" />
    <meta property="og:title" content="하늘과 땅을 흔드는 기도 | 매일 말씀 묵상" />
    <meta property="og:description" content="누가복음 11장 · 월요일부터 토요일까지 하루 10분 말씀 묵상" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>매일 말씀 묵상</title>
    <style>
:root {
  color-scheme: light;
  --paper: #fbf6ec;
  --panel: #fffdf8;
  --panel-2: #fff8ec;
  --ink: #2b211a;
  --ink-2: #5d5040;
  --muted: #8d7c64;
  --line: rgba(74, 52, 26, 0.13);
  --line-soft: rgba(74, 52, 26, 0.07);
  --accent: #2f7560;
  --gold: #9a6512;
  --gold-soft: rgba(161, 106, 20, 0.12);
  --verse-bg: #fff6e6;
  --ring: rgba(161, 106, 20, 0.4);
  --shadow-1: 0 1px 2px rgba(60, 40, 18, 0.05), 0 4px 12px rgba(60, 40, 18, 0.06);
  --shadow-2: 0 2px 4px rgba(60, 40, 18, 0.05), 0 14px 30px rgba(60, 40, 18, 0.10);
  --card-fade: rgba(251, 246, 236, 0.97);
  --card-fade-2: rgba(251, 246, 236, 0.80);
  --radius: 16px;
  --serif: "Nanum Myeongjo", "Gowun Batang", "Batang", Georgia, serif;
  --sans: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #17130f;
  --panel: #211b15;
  --panel-2: #2a221a;
  --ink: #efe6d8;
  --ink-2: #cbbda8;
  --muted: #9d8f7b;
  --line: rgba(239, 222, 196, 0.13);
  --line-soft: rgba(239, 222, 196, 0.07);
  --gold: #e0b060;
  --gold-soft: rgba(224, 176, 96, 0.16);
  --verse-bg: #2a2118;
  --ring: rgba(224, 176, 96, 0.5);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, 0.35);
  --card-fade: rgba(23, 19, 15, 0.96);
  --card-fade-2: rgba(23, 19, 15, 0.78);
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  transition: background 240ms ease, color 240ms ease;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; flex: none; }

.screen { min-height: 100vh; animation: fadeIn 360ms cubic-bezier(.2,.7,.2,1) backwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

/* ===== 상단 도구 줄 (화면을 가리지 않도록 고정하지 않음) ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: min(1080px, calc(100% - 32px));
  margin: 0 auto;
  padding: 14px 0 0;
}
.topbar .brand img { display: block; width: 168px; height: auto; }
:root[data-theme="dark"] .topbar .brand img { filter: brightness(1.6) saturate(.6); }
.topbar .back { display: inline-flex; align-items: center; gap: 4px; padding: 8px 4px; border: 0; background: none; color: var(--ink-2); font-weight: 600; font-size: .92rem; }
.tools { display: flex; gap: 6px; }
.tool {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-2);
  font-size: 1.05rem;
}
.tool[aria-pressed="true"] { color: var(--gold); border-color: var(--ring); }

/* ===== 목록 ===== */
.hero {
  position: relative;
  width: min(1080px, calc(100% - 32px));
  margin: 16px auto 0;
  padding: 26px 22px 24px;
  border-radius: 20px;
  overflow: hidden;
  background-image:
    linear-gradient(180deg, var(--card-fade-2) 0%, var(--card-fade) 72%),
    var(--hero-image);
  background-size: cover;
  background-position: center 40%;
  border: 1px solid var(--line-soft);
}
.kicker { margin: 0 0 10px; color: var(--gold); font-size: .8rem; font-weight: 700; letter-spacing: .06em; }
.hero h1 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: clamp(2.1rem, 8vw, 3.6rem);
  line-height: 1.15;
  word-break: keep-all;
}
.hero .passage { margin: 0 0 22px; color: var(--ink-2); font-size: .95rem; }
.progress { display: flex; align-items: center; gap: 14px; color: var(--ink-2); font-size: .88rem; }
.progress-track { flex: 1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress-track span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), #c79233); transition: width 400ms ease; }
.progress strong { white-space: nowrap; }

.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.pill-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink);
  font-size: .88rem;
  font-weight: 600;
}
.pill-button.primary { background: var(--gold); border-color: transparent; color: #fffaf0; }
:root[data-theme="dark"] .pill-button.primary { color: #1b150f; }

.journey { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 60px; }
.section-label { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; color: var(--gold); font-size: .8rem; font-weight: 700; letter-spacing: .06em; }
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

.day-card {
  position: relative;
  display: grid;
  align-content: end;
  min-height: 250px;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow-1);
  text-align: left;
  transition: transform 200ms ease, box-shadow 200ms ease;
}
.day-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.day-card .photo { position: absolute; inset: 0 0 auto 0; height: 150px; background: var(--image) center / cover; }
.day-card .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--panel) 100%); }
.card-copy { position: relative; display: grid; gap: 4px; padding: 118px 18px 18px; }
.card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.card-meta .date {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--panel);
  color: var(--gold);
  font-size: .76rem;
  font-weight: 700;
  box-shadow: var(--shadow-1);
}
/* 설교영상 표시: 제목 글씨 설정이 번지지 않도록 크기를 따로 지정 */
.card-meta .video-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: .72rem;
  font-weight: 600;
  box-shadow: var(--shadow-1);
}
.card-meta .video-tag svg { width: .8em; height: .8em; }
.card-copy .nav-title { margin-top: 6px; color: var(--accent); font-size: .86rem; font-weight: 700; }
.card-copy .title { font-family: var(--serif); font-size: 1.28rem; font-weight: 700; line-height: 1.38; word-break: keep-all; }
.card-copy .ref { color: var(--muted); font-size: .8rem; }
.today-badge, .check-badge {
  position: absolute;
  z-index: 2;
  top: 12px;
  right: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: .76rem;
  font-weight: 700;
}
.today-badge { background: var(--gold); color: #fffaf0; }
.check-badge { background: var(--accent); color: #fff; }
.day-card.today { border-color: var(--ring); box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow-2); }
.day-card.done .title { color: var(--ink-2); }

.review-card {
  display: grid;
  gap: 6px;
  align-content: center;
  min-height: 250px;
  padding: 24px;
  border: 1.5px dashed var(--ring);
  border-radius: var(--radius);
  background: var(--panel-2);
  text-align: left;
}
.review-card small { color: var(--gold); font-weight: 700; font-size: .78rem; letter-spacing: .05em; }
.review-card strong { font-family: var(--serif); font-size: 1.3rem; }
.review-card span { color: var(--ink-2); font-size: .9rem; line-height: 1.6; }

/* ===== 상세 ===== */
.detail { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 14px 0 120px; }
.detail-head { padding: 18px 2px 6px; }
.detail-head .kicker { margin-bottom: 8px; }
.detail-head h1 { margin: 0; font-family: var(--serif); font-size: clamp(1.75rem, 6.4vw, 2.5rem); line-height: 1.25; word-break: keep-all; }
.detail-photo { height: 180px; margin: 18px 0 0; border-radius: var(--radius); background: var(--detail-image) center / cover; }

.block { margin-top: 16px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.block-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; color: var(--gold); font-size: .8rem; font-weight: 700; letter-spacing: .05em; }
.block-label small { color: var(--muted); font-weight: 500; letter-spacing: 0; }
.block p { margin: 0; line-height: 1.8; word-break: keep-all; }
.block > .block-label, .block .block-label { margin: 0 0 12px; color: var(--gold); font-size: .8rem; line-height: 1.4; }

.pause { display: flex; gap: 12px; align-items: flex-start; background: var(--panel-2); border-style: dashed; }
.pause .num { font-size: 1.2rem; line-height: 1.6; }
.pause p { color: var(--ink-2); font-size: .94rem; }
.pause em { display: block; margin-top: 4px; color: var(--ink); font-family: var(--serif); font-style: normal; font-weight: 700; }

.scripture { background: var(--verse-bg); border-color: var(--line-soft); }
.scripture h3 { margin: 18px 0 8px; color: var(--ink-2); font-size: .86rem; font-weight: 700; }
.scripture h3:first-of-type { margin-top: 0; }
.verse-line { display: flex; gap: 10px; margin: 0 0 8px; padding: 4px 8px; border-radius: 8px; font-family: var(--serif); font-size: 1.06rem; line-height: 1.85; word-break: keep-all; }
.verse-line sup { flex: none; min-width: 1.4em; padding-top: .35em; color: var(--gold); font-family: var(--sans); font-size: .72rem; font-weight: 700; }
.verse-line.key { background: var(--gold-soft); font-weight: 700; }
.scripture .source { display: block; margin-top: 12px; color: var(--muted); font-size: .76rem; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-2);
  font-size: .84rem;
  font-weight: 600;
}

.key-verse { position: relative; padding: 24px 22px; border: 0; background: linear-gradient(135deg, var(--gold-soft), transparent 80%), var(--panel); }
.key-verse blockquote { margin: 0; font-family: var(--serif); font-size: 1.32rem; font-weight: 700; line-height: 1.65; word-break: keep-all; }
.key-verse cite { display: block; margin-top: 10px; color: var(--gold); font-style: normal; font-size: .84rem; font-weight: 700; }

.sermon p:not(.block-label) { color: var(--ink-2); font-size: .98rem; }
details.clip { margin-top: 14px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
details.clip summary { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: .9rem; font-weight: 600; cursor: pointer; list-style: none; }
details.clip summary::-webkit-details-marker { display: none; }
details.clip summary::after { content: "펼치기"; color: var(--muted); font-size: .78rem; font-weight: 500; }
details.clip[open] summary::after { content: "접기"; }
.clip-frame { position: relative; margin-top: 12px; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #111; }
.clip-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.questions ol { margin: 0; padding: 0; list-style: none; counter-reset: q; display: grid; gap: 12px; }
.questions li { counter-increment: q; display: flex; gap: 12px; line-height: 1.7; word-break: keep-all; }
.questions li::before { content: counter(q); flex: none; display: grid; place-items: center; width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); font-size: .8rem; font-weight: 700; }

.journal textarea {
  width: 100%;
  min-height: 190px;
  margin-top: 12px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  font-size: 1rem;
  line-height: 1.8;
  resize: vertical;
}
.journal .hint { margin-top: 8px; color: var(--muted); font-size: .78rem; }
.journal .chip { border-style: dashed; }

.two-col { display: grid; gap: 16px; margin-top: 16px; }
.two-col .block { margin-top: 0; }
@media (min-width: 720px) { .two-col { grid-template-columns: 1fr 1fr; } }

.prayer { display: flex; gap: 12px; background: var(--panel-2); }
.prayer svg { margin-top: 6px; color: var(--gold); font-size: 1.1rem; }
.prayer p { font-family: var(--serif); font-size: 1.04rem; line-height: 1.85; }

/* 하단 이동 줄: 한 줄로 얇게 */
.bottom-bar {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  width: min(560px, calc(100% - 24px));
  padding: 6px;
  transform: translateX(-50%);
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  box-shadow: var(--shadow-2);
  backdrop-filter: blur(12px);
}
.bottom-bar button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 42px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font-size: .88rem; font-weight: 600; }
.bottom-bar .nav { width: 42px; font-size: 1.1rem; }
.bottom-bar .count { min-width: 44px; text-align: center; color: var(--muted); font-size: .84rem; }
.bottom-bar .list { padding: 0 12px; }
.bottom-bar .done-btn { flex: 1; background: var(--gold); color: #fffaf0; }
:root[data-theme="dark"] .bottom-bar .done-btn { color: #1b150f; }
.bottom-bar .done-btn.done { background: var(--accent); color: #fff; }

/* 돌아보기·모아보기 */
.review-list { display: grid; gap: 12px; margin-top: 16px; }
.review-item { padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.review-item small { color: var(--gold); font-size: .78rem; font-weight: 700; }
.review-item strong { display: block; margin: 4px 0 8px; font-family: var(--serif); font-size: 1.05rem; }
.review-item p { margin: 0; color: var(--ink-2); line-height: 1.75; white-space: pre-wrap; }
.review-item p.empty { color: var(--muted); }
.review-item p { word-break: keep-all; }
.pause p { word-break: keep-all; }
.week-group { margin-top: 26px; }
.week-group h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 1.2rem; }
.week-group .sub { margin: 0; color: var(--muted); font-size: .84rem; }
.action-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.empty-box { margin-top: 20px; padding: 26px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; line-height: 1.7; }

.archive-panel { position: fixed; z-index: 30; inset: 0; display: grid; place-items: end center; background: rgba(20, 14, 8, .35); }
.archive-sheet { width: min(560px, 100%); max-height: 78vh; overflow: auto; padding: 20px 18px 28px; border-radius: 20px 20px 0 0; background: var(--panel); }
.archive-sheet h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 1.2rem; }
.archive-item { display: grid; gap: 2px; padding: 12px 4px; border-bottom: 1px solid var(--line-soft); color: inherit; text-decoration: none; }
.archive-item small { color: var(--muted); font-size: .76rem; }
.archive-item strong { font-size: .98rem; }
.archive-item span { color: var(--ink-2); font-size: .82rem; }

.toast { position: fixed; z-index: 40; left: 50%; bottom: 76px; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 999px; background: #2b211a; color: #fbf6ec; font-size: .88rem; opacity: 0; transform: translate(-50%, 8px); transition: 220ms ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 520px) {
  .topbar .brand img { width: 138px; }
  .block { padding: 18px 16px; }
  .key-verse blockquote { font-size: 1.2rem; }
  .detail-photo { height: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
// ─────────────────────────────────────────────
// 매주 바뀌는 내용은 weeklyContent 안에만 있습니다.
// 성경 본문(scripture)은 개역한글(저작권 만료)을 씁니다.

// ───────────── 저장 (기존 기록과 같은 이름을 써서 그대로 이어집니다) ─────────────
const STORE_PREFIX = "personal-devotion-";
const storageKey = STORE_PREFIX + weeklyContent.weekId;
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); return true; } catch { return false; } },
  keys() { try { return Object.keys(localStorage); } catch { return []; } }
};
function readWeek(key) { try { return JSON.parse(store.get(key)) || {}; } catch { return {}; } }

const devotions = weeklyContent.days;
const dayNames = { mon: "월요일", tue: "화요일", wed: "수요일", thu: "목요일", fri: "금요일", sat: "토요일", review: "한 주 돌아보기" };
const saved = readWeek(storageKey);
const state = {
  view: "list",
  selected: 0,
  completed: new Set(saved.completed || []),
  entries: saved.entries || {}
};
function persist() {
  store.set(storageKey, JSON.stringify({ selected: state.selected, completed: [...state.completed], entries: state.entries }));
}

// ───────────── 오늘 날짜 찾기 ─────────────
function dayDate(d) {
  const m = d.date.match(/^(\d{1,2})\.(\d{1,2})/);
  if (!m) return null;
  const [y, wm] = weeklyContent.weekId.split("-").map(Number);
  const month = Number(m[1]);
  return new Date(month < wm ? y + 1 : y, month - 1, Number(m[2]));
}
const sameDay = (a, b) => a && b && a.toDateString() === b.toDateString();
const todayIndex = devotions.findIndex((d) => sameDay(dayDate(d), new Date()));

const params = new URLSearchParams(location.search);
if (params.get("day") !== null && devotions[Number(params.get("day"))]) {
  state.view = "detail";
  state.selected = Number(params.get("day"));
} else if (params.get("view") === "review") state.view = "review";
else if (params.get("view") === "all") state.view = "all";
else if (todayIndex >= 0) state.selected = todayIndex;

  pen: '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
};
const icon = (n) => icons[n] || "";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ───────────── 영상 ─────────────
function toSeconds(v) { return String(v || "").split(":").map(Number).reduce((t, n) => t * 60 + n, 0); }
function youtubeId(v) { const m = String(v || "").match(/(?:youtu\.be\/|v=|\/embed\/|\/live\/)([\w-]{11})/); return m ? m[1] : ""; }
function clipSrc(d) {
  const id = youtubeId(weeklyContent.sermonVideo);
  if (!id || !d.video) return "";
  const p = new URLSearchParams({ rel: "0", playsinline: "1", start: toSeconds(d.video.start), end: toSeconds(d.video.end) });
  return `https://www.youtube.com/embed/${id}?${p}`;
}
function clipLength(d) {
  const s = toSeconds(d.video.end) - toSeconds(d.video.start);
  return `${Math.floor(s / 60)}분 ${s % 60}초`;
}

// ───────────── 공통 상단 줄 ─────────────

// ───────────── 내 묵상 모아보기 (모든 주차) ─────────────
function allWeeks() {
  const titles = Object.fromEntries(weeklyArchive.map((w) => [w.weekId, w]));
  return store.keys()
    .filter((k) => k.startsWith(STORE_PREFIX))
    .map((k) => {
      const weekId = k.slice(STORE_PREFIX.length);
      const data = readWeek(k);
      const entries = Object.entries(data.entries || {}).filter(([, t]) => String(t).trim());
      return { weekId, info: titles[weekId], entries };
    })
    .filter((w) => w.entries.length)
    .sort((a, b) => b.weekId.localeCompare(a.weekId));
}
const dayOrder = ["mon", "tue", "wed", "thu", "fri", "sat", "review"];
function weekText(w) {
  const head = `[${w.info ? w.info.sermonDate + " · " + w.info.themeTitle : w.weekId}]`;
  const body = [...w.entries]
    .sort((a, b) => dayOrder.indexOf(a[0]) - dayOrder.indexOf(b[0]))
    .map(([id, t]) => `■ ${dayNames[id] || id}\n${t.trim()}`)
    .join("\n\n");
  return `${head}\n\n${body}`;
}
function renderAll() {
  const weeks = allWeeks();
  return `
    <section class="screen">
      ${topbar(true)}
      <main class="detail">
        <header class="detail-head">
          <p class="kicker">지금까지 적은 묵상</p>
          <h1>내 묵상 모아보기</h1>
        </header>
        <div class="block pause">
          <span class="num" aria-hidden="true">💡</span>
          <p>기록은 이 휴대폰의 이 브라우저에만 저장됩니다. 카톡 안에서 열 때와 크롬·사파리에서 열 때 저장소가 달라요. 한 곳을 정해서 쓰시고, 가끔 아래 버튼으로 복사하거나 파일로 저장해 두세요.</p>
        </div>
        ${weeks.length ? `
          <div class="action-row">
            <button class="pill-button primary" data-act="copy-all" type="button">${icon("copy")} 전체 복사</button>
            <button class="pill-button" data-act="download-all" type="button">${icon("download")} 텍스트 파일로 저장</button>
          </div>
          ${weeks.map((w) => `
            <section class="week-group">
              <h2>${w.info ? w.info.themeTitle : w.weekId}</h2>
              <p class="sub">${w.info ? `${w.info.sermonDate} · ${w.info.passage}` : ""}</p>
              <div class="review-list">
                ${[...w.entries].sort((a, b) => dayOrder.indexOf(a[0]) - dayOrder.indexOf(b[0])).map(([id, t]) => `
                  <article class="review-item"><small>${dayNames[id] || id}</small><p>${esc(t)}</p></article>`).join("")}
              </div>
            </section>`).join("")}
        ` : `<div class="empty-box">아직 모인 기록이 없어요.<br>오늘 묵상에서 한 줄을 적어 보면 이곳에 쌓입니다.</div>`}
      </main>
    </section>`;
}

// ───────────── 지난 설교 ─────────────
function openArchive() {
  const wrap = document.createElement("div");
  wrap.className = "archive-panel";
  wrap.innerHTML = `
    <div class="archive-sheet" role="dialog" aria-label="지난 설교 묵상">
      <h2>지난 설교 묵상</h2>
      ${weeklyArchive.map((w) => `
        <a class="archive-item" href="${w.href}">

        </a>`).join("")}

  wrap.addEventListener("click", (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
}

// ───────────── 화면 그리기 ─────────────
const $app = document.getElementById("app");
function render() {
  window.speechSynthesis && speechSynthesis.cancel();
  $app.innerHTML = state.view === "detail" ? renderDetail()
    : state.view === "review" ? renderReview()
    : state.view === "all" ? renderAll()
    : renderList();
}
function go(view, index) {
  if (index !== undefined) state.selected = (index + devotions.length) % devotions.length;
  state.view = view;
  persist();
  render();
  window.scrollTo(0, 0);
}

$app.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.open !== undefined) return go("detail", Number(b.dataset.open));
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.starter !== undefined) {
    const d = devotions[state.selected];
    const ta = document.getElementById("journal");
    const line = d.starters[Number(b.dataset.starter)];
    ta.value = ta.value.trim() ? `${ta.value.replace(/\s+$/, "")}\n${line}` : line;
    state.entries[d.id] = ta.value;
    persist();
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  const act = b.dataset.act;
  if (act === "prev") go("detail", state.selected - 1);
  if (act === "next") go("detail", state.selected + 1);
  if (act === "complete") {
    const id = devotions[state.selected].id;
    state.completed.has(id) ? state.completed.delete(id) : state.completed.add(id);
    persist();
    const all = devotions.every((d) => state.completed.has(d.id));
    if (state.completed.has(id)) {
      if (all) { toast("6일 묵상을 모두 마쳤어요. 한 주를 돌아볼까요?"); return go("review"); }
      toast("오늘 묵상을 마쳤습니다.");
    }
    render();
  }
  if (act === "listen") listen(b);
  if (act === "share") share();
  if (act === "archive") openArchive();
  if (act === "font") { fontIndex = (fontIndex + 1) % fonts.length; applyFont(); render(); toast(["기본 글씨", "글씨 크게", "글씨 더 크게"][fontIndex]); }
  if (act === "theme") { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); render(); }
  if (act === "copy-week") copyText(weekText({ weekId: weeklyContent.weekId, info: weeklyArchive[0], entries: Object.entries(state.entries).filter(([, t]) => String(t).trim()) }));
  if (act === "copy-all") copyText(allWeeks().map(weekText).join("\n\n────────\n\n"));
  if (act === "download-all") download(allWeeks().map(weekText).join("\n\n────────\n\n"));
});

$app.addEventListener("input", (e) => {
  if (e.target.id === "journal") state.entries[devotions[state.selected].id] = e.target.value;
  if (e.target.id === "review") state.entries.review = e.target.value;
  persist();
});

// 영상은 펼칠 때만 불러와서 처음 여는 속도를 가볍게
$app.addEventListener("toggle", (e) => {
  const f = e.target.querySelector?.("iframe[data-src]");
  if (e.target.open && f && !f.src) f.src = f.dataset.src;
}, true);

// ───────────── 듣기·나누기·복사 ─────────────
function listen(button) {
  const synth = window.speechSynthesis;
  if (!synth) return toast("이 브라우저에서는 음성 듣기를 지원하지 않아요.");
  if (synth.speaking) { synth.cancel(); button.innerHTML = `${icon("speaker")} 본문 듣기`; return; }
  const d = devotions[state.selected];
  const text = d.scripture.map((s) => `${s.ref.replace(":", "장 ").replace("-", "절에서 ")}절. ${s.verses.map((v) => v[1]).join(" ")}`).join(" ");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR";
  u.rate = 0.9;
  u.onend = u.onerror = () => { button.innerHTML = `${icon("speaker")} 본문 듣기`; };
  synth.cancel();
  synth.speak(u);
  button.innerHTML = `${icon("stop")} 그만 듣기`;
  if (/KAKAOTALK/i.test(navigator.userAgent)) toast("소리가 안 나오면 ⋮ → 다른 브라우저로 열기를 눌러 주세요.");
}
async function share() {
  const d = devotions[state.selected];
  const text = `“${d.keyVerse.text}”\n(${d.keyVerse.ref})\n\n${weeklyContent.themeTitle}`;
  const url = location.protocol.startsWith("http") ? `${location.origin}${location.pathname}?day=${state.selected}` : "";
  if (navigator.share) { try { await navigator.share(url ? { text, url } : { text }); } catch {} return; }
  copyText(url ? `${text}\n${url}` : text);
}
async function copyText(text) {
  if (!text.trim()) return toast("아직 복사할 기록이 없어요.");
  try { await navigator.clipboard.writeText(text); toast("복사했어요. 메모장이나 카톡 나와의 채팅에 붙여 두세요."); }
  catch { toast("이 환경에서는 복사가 막혀 있어요."); }
}
function download(text) {
  if (!text.trim()) return toast("아직 저장할 기록이 없어요.");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  a.download = `내-묵상-기록-${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// ───────────── 글씨 크기 · 밤 화면 ─────────────
const fonts = [1, 1.12, 1.24];
let fontIndex = Number(store.get("devotion-font-scale")) || 0;
if (!fonts[fontIndex]) fontIndex = 0;
function applyFont() { document.documentElement.style.fontSize = `${fonts[fontIndex] * 100}%`; store.set("devotion-font-scale", String(fontIndex)); }
function setTheme(t) { document.documentElement.dataset.theme = t; store.set("devotion-theme", t); }
const savedTheme = store.get("devotion-theme");
document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyFont();
render();
    </script>
  </body>
</html>
