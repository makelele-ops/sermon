<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="대전순복음교회 주일설교로 이어가는 6일 말씀 묵상" />
    <meta name="theme-color" content="#f6f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon-48.png" />
    <link rel="apple-touch-icon" href="/assets/brand/app-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말씀묵상" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>매일 말씀 묵상</title>
    <style>
:root {
  --paper: #f6f1e8;
  --paper-2: #fdfaf4;
  --paper-3: #efe7da;
  --ink: #2a231d;
  --ink-2: #554b40;
  --ink-3: #887c6e;
  --line: #e4dacb;
  --brand: #24584a;
  --brand-2: #e3ece6;
  --on-brand: #ffffff;
  --gold: #9c6b14;
  --gold-2: #f6ead2;
  --shadow: 0 1px 2px rgb(60 40 20 / 6%), 0 8px 28px rgb(60 40 20 / 8%);
  --radius: 18px;
  --serif: "Nanum Myeongjo", "Noto Serif KR", serif;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171412;
    --paper-2: #211d19;
    --paper-3: #2a251f;
    --ink: #f0e9df;
    --ink-2: #cdc2b4;
    --ink-3: #9d9183;
    --line: #3a332b;
    --brand: #86c4ab;
    --brand-2: #1f322b;
    --on-brand: #10201a;
    --gold: #dcae55;
    --gold-2: #3a2f1c;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 10px 30px rgb(0 0 0 / 35%);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font: 400 1rem/1.7 var(--sans);
  letter-spacing: -0.01em;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { display: block; max-width: 100%; }
svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 상단 바 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 8px;
  height: 60px; padding: 0 max(16px, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar-inner { width: 100%; max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; border: 0; background: none; padding: 4px 6px 4px 0; border-radius: 10px; }
.brand img { height: 38px; width: auto; }
@media (prefers-color-scheme: dark) { .brand img { background: #fbf8f2; border-radius: 8px; padding: 3px 6px; } }
.back-btn { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 8px 10px 8px 2px; font-weight: 700; color: var(--ink); border-radius: 10px; }
.back-btn svg { width: 1.4em; height: 1.4em; }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
.top-btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--paper-2); color: var(--ink-2);
  font-size: .875rem; font-weight: 650;
}
.top-btn[aria-pressed="true"] { background: var(--brand-2); color: var(--brand); border-color: transparent; }
.font-btn { font-family: var(--serif); font-weight: 800; padding: 0 12px; }
.font-btn small { font-family: var(--sans); font-size: .7rem; margin-left: 1px; }

/* ---------- 공통 레이아웃 ---------- */
.app { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }
.screen { animation: fade .35s ease both; }
.screen.slide-left { animation-name: from-right; }
.screen.slide-right { animation-name: from-left; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes from-right { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes from-left { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.eyebrow { margin: 0; color: var(--gold); font-size: .8125rem; font-weight: 750; letter-spacing: .02em; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 40px 0 14px; }
.section-title h2 { margin: 0; font: 800 1.25rem/1.4 var(--serif); }
.section-title span { color: var(--ink-3); font-size: .875rem; }
.link-btn { border: 0; background: none; padding: 6px 0; color: var(--brand); font-weight: 700; font-size: .9rem; }

/* ---------- 지난 설교 안내 띠 ---------- */
.past-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin: 12px 0 0; padding: 12px 16px;
  background: var(--gold-2); border-radius: 14px; color: var(--ink-2); font-size: .9rem;
}
.past-banner a { color: var(--gold); font-weight: 750; text-decoration: none; white-space: nowrap; }

/* ---------- 홈: 머리글 ---------- */
.home-top { display: grid; gap: 22px; padding-top: 22px; }
.intro h1 { margin: 10px 0 8px; font: 800 clamp(2rem, 7.6vw, 3.1rem)/1.25 var(--serif); letter-spacing: -0.03em; }
.intro .passage { margin: 0; color: var(--ink-2); font-size: 1.0625rem; font-weight: 550; }
.intro-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 44px; padding: 0 18px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--paper-2); color: var(--ink); text-decoration: none;
  font-size: .9375rem; font-weight: 700;
}
.pill-btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.pill-btn svg { width: 1em; height: 1em; }

/* 주간 진행 */
.week {
  margin-top: 26px; padding: 16px; border-radius: var(--radius);
  background: var(--paper-2); box-shadow: var(--shadow);
}
.week-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.week-head strong { font-size: .9375rem; }
.week-head span { font-size: .8125rem; color: var(--ink-3); font-weight: 650; }
.week-days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.wd {
  position: relative; display: grid; place-items: center; gap: 2px;
  padding: 10px 0 9px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--paper); color: var(--ink-2);
}
.wd b { font-size: .8125rem; font-weight: 700; }
.wd span { font: 800 1.125rem/1 var(--serif); color: var(--ink); }
.wd i { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 4px; }
.wd.done i { background: var(--brand); }
.wd.today { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.wd.today span { color: var(--on-brand); }
.wd.today.done i { background: var(--on-brand); }

/* 오늘의 묵상 카드 */
.feature {
  display: grid; overflow: hidden; border-radius: 22px;
  background: var(--paper-2); box-shadow: var(--shadow);
  border: 0; padding: 0; text-align: left; width: 100%;
}
.feature-img { position: relative; aspect-ratio: 3 / 2; overflow: hidden; background: var(--paper-3); }
.feature-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.feature:hover .feature-img img { transform: scale(1.025); }
.feature-tag {
  position: absolute; left: 14px; top: 14px;
  padding: 6px 12px; border-radius: 999px;
  background: rgb(255 255 255 / 92%); color: #2a231d; font-size: .8125rem; font-weight: 800;
}
.feature-body { padding: 20px 20px 22px; }
.feature-body h3 { margin: 6px 0 10px; font: 800 1.5rem/1.38 var(--serif); letter-spacing: -0.02em; }
.feature-verse { margin: 0 0 16px; padding-left: 12px; border-left: 3px solid var(--accent, var(--brand)); color: var(--ink-2); font: 700 1rem/1.7 var(--serif); }
.feature-cta { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 800; }

/* 6일 목록 */
.day-list { display: grid; gap: 10px; }
.day-row {
  display: grid; grid-template-columns: 84px 1fr auto; align-items: center; gap: 14px;
  width: 100%; padding: 10px 14px 10px 10px; border: 1px solid var(--line); border-radius: 16px;
  background: var(--paper-2); text-align: left;
  transition: border-color .2s, transform .2s;
}
.day-row:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
.day-row:active { transform: scale(.99); }
.day-row.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.day-thumb { width: 84px; height: 64px; border-radius: 11px; overflow: hidden; background: var(--paper-3); }
.day-thumb img { width: 100%; height: 100%; object-fit: cover; }
.day-row small { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: .8125rem; font-weight: 700; }
.day-row small em { font-style: normal; color: var(--brand); }
.day-row small .vid { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px 1px 5px; border-radius: 999px; background: var(--paper-3); color: var(--ink-2); font-size: .72rem; }
.day-row small .vid svg { width: .8em; height: .8em; }
.day-row strong { display: block; margin-top: 2px; font: 800 1.0625rem/1.45 var(--serif); color: var(--ink); }
.day-row .nav-title { display: block; color: var(--ink-3); font-size: .8125rem; margin-top: 2px; }
.day-status { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); color: transparent; }
.day-row.done .day-status { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.day-status svg { width: 16px; height: 16px; stroke-width: 3; }

/* 말씀 도우미 소개 */
.ask-card {
  display: none; margin-top: 40px; padding: 22px 20px; border-radius: 22px;
  background: linear-gradient(160deg, var(--brand-2), var(--paper-2));
  border: 1px solid color-mix(in srgb, var(--brand) 18%, var(--line));
}
html[data-assistant="ready"] .ask-card { display: block; }
.ask-card h2 { margin: 6px 0 6px; font: 800 1.25rem/1.4 var(--serif); }
.ask-card p { margin: 0 0 14px; color: var(--ink-2); font-size: .9375rem; }
.ask-card .eyebrow { color: var(--brand); }
.ask-input {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; min-height: 52px; padding: 0 8px 0 16px; margin-bottom: 12px;
  border: 1px solid var(--line); border-radius: 16px; background: var(--paper-2);
  color: var(--ink-3); text-align: left; font-size: .9375rem;
}
.ask-input span:last-child { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--brand); color: var(--on-brand); }
.ask-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2);
  font-size: .875rem; font-weight: 650;
}

/* 지난 설교 목록 (홈 하단) */
.archive-mini { display: grid; gap: 0; border-top: 1px solid var(--line); }
.archive-mini a, .archive-item {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: baseline;
  padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none;
}
.archive-mini small, .archive-item small { grid-row: span 2; color: var(--ink-3); font-size: .8125rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4.6em; }
.archive-mini strong, .archive-item strong { font: 800 1rem/1.45 var(--serif); }
.archive-mini span, .archive-item span { color: var(--ink-3); font-size: .8125rem; }
.archive-item.current strong::after { content: "보는 중"; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--brand-2); color: var(--brand); font: 700 .7rem/1.6 var(--sans); vertical-align: middle; }

.site-foot { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: .8125rem; text-align: center; }

/* ---------- 상세 화면 ---------- */
.reader { max-width: 720px; margin: 0 auto; }
.reader-hero { position: relative; margin: 14px -16px 0; aspect-ratio: 3 / 2; max-height: 58vh; overflow: hidden; background: var(--paper-3); }
.reader-hero img { width: 100%; height: 100%; object-fit: cover; }
.reader-head { padding: 22px 0 6px; }
.reader-head .eyebrow { color: var(--accent, var(--gold)); }
.reader-head h1 { margin: 8px 0 8px; font: 800 clamp(1.75rem, 6.4vw, 2.4rem)/1.32 var(--serif); letter-spacing: -0.03em; }
.reader-head .sub { margin: 0; color: var(--ink-3); font-size: .9375rem; }
.verse {
  position: relative; margin: 22px 0 8px; padding: 22px 20px 18px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--accent, var(--gold)) 9%, var(--paper-2));
  border: 1px solid color-mix(in srgb, var(--accent, var(--gold)) 22%, var(--line));
}
.verse-label { color: var(--accent, var(--gold)); font-size: .8125rem; font-weight: 800; }
.verse-text { margin: 8px 0 8px; font: 800 1.3125rem/1.65 var(--serif); letter-spacing: -0.02em; }
.verse-ref { margin: 0; color: var(--ink-2); font-size: .875rem; font-weight: 650; }
.verse-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.reading { margin: 26px 0 0; font-size: 1.125rem; line-height: 1.95; color: var(--ink); }
.reading p { margin: 0 0 1em; }
.block-title { margin: 34px 0 12px; font: 800 1.125rem/1.4 var(--serif); }

.clip { margin-top: 26px; }
.clip-btn {
  position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: var(--radius); overflow: hidden;
  aspect-ratio: 16 / 9; background: #111 linear-gradient(135deg, #2b2620, #111);
}
.clip-btn img { width: 100%; height: 100%; object-fit: cover; opacity: .78; }
.clip-btn .play {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; color: #fff;
  background: linear-gradient(180deg, rgb(0 0 0 / 5%), rgb(0 0 0 / 50%));
}
.clip-btn .play i { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: rgb(255 255 255 / 94%); color: #1d1a17; }
.clip-btn .play i svg { width: 26px; height: 26px; margin-left: 4px; }
.clip-btn .play b { font-size: 1rem; text-shadow: 0 1px 6px rgb(0 0 0 / 50%); }
.clip-btn .play small { font-size: .8125rem; opacity: .92; }
.clip iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: var(--radius); background: #000; }

.cards { display: grid; gap: 10px; }
.card {
  padding: 18px 18px 16px; border-radius: var(--radius); background: var(--paper-2); border: 1px solid var(--line);
}
.card > span { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: .8125rem; font-weight: 800; }
.card > span svg { color: var(--accent, var(--brand)); }
.card p { margin: 8px 0 0; font-size: 1.0625rem; line-height: 1.8; }
.card.prayer { background: var(--brand-2); border-color: transparent; }
.card.prayer p { font-family: var(--serif); font-weight: 700; }
.card.family { background: var(--gold-2); border-color: transparent; }

.ask-inline {
  display: none; align-items: center; gap: 14px; width: 100%; margin-top: 26px; padding: 16px 18px;
  border: 1px dashed color-mix(in srgb, var(--brand) 45%, var(--line)); border-radius: var(--radius);
  background: transparent; text-align: left;
}
html[data-assistant="ready"] .ask-inline { display: flex; }
.ask-inline i { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 14px; background: var(--brand); color: var(--on-brand); font-style: normal; }
.ask-inline b { display: block; font-size: 1rem; }
.ask-inline span { color: var(--ink-3); font-size: .875rem; }

.journal { margin-top: 10px; }
.journal-note { margin: -4px 0 10px; color: var(--ink-3); font-size: .8125rem; }
.journal .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.journal textarea {
  display: block; width: 100%; min-height: 168px; padding: 16px; resize: vertical;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2);
  font-size: 1.0625rem; line-height: 1.8;
}
.journal textarea::placeholder { color: var(--ink-3); }
.detail-end { height: 120px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px 16px calc(10px + var(--safe-b));
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.dock-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center; }
.icon-btn { display: grid; place-items: center; height: 52px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper-2); color: var(--ink); }
.icon-btn svg { width: 1.4em; height: 1.4em; }
.done-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px;
  width: 100%; border: 0; border-radius: 16px; background: var(--brand); color: var(--on-brand); font-size: 1.0625rem; font-weight: 800;
}
.dock-inner > div { min-width: 0; }
.done-btn.done { background: var(--brand-2); color: var(--brand); }
.dock-count { display: block; text-align: center; color: var(--ink-3); font-size: .75rem; font-weight: 700; margin-top: 6px; }

/* ---------- 홈 화면에 추가 ---------- */
.install-card {
  display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 10px 12px 12px;
  border-radius: var(--radius); background: var(--paper-2); border: 1px solid color-mix(in srgb, var(--brand) 25%, var(--line));
}
.install-card img { width: 46px; height: 46px; border-radius: 12px; flex: none; box-shadow: 0 1px 4px rgb(0 0 0 / 12%); }
.install-card div { flex: 1; min-width: 0; }
.install-card b { display: block; font-size: .9375rem; }
.install-card span { display: block; color: var(--ink-3); font-size: .8125rem; line-height: 1.5; }
.install-card .install-go { flex: none; height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-weight: 800; font-size: .875rem; }
.install-card .install-x { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-3); font-size: 1.2rem; line-height: 1; }
.install-steps { margin: 4px 0 16px; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
.install-steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--paper-2); border: 1px solid var(--line); font-size: 1rem; line-height: 1.6; }
.install-steps li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--on-brand); font-weight: 800; font-size: .875rem; }
.install-steps .ico { display: inline-grid; place-items: center; width: 26px; height: 26px; margin: 0 2px; border-radius: 7px; background: var(--paper-3); vertical-align: -6px; }
.install-steps .ico svg { width: 16px; height: 16px; }
.install-lead { margin: 0 0 14px; color: var(--ink-2); }
.install-sheet .done-btn { margin-bottom: 8px; text-decoration: none; }
.foot-link { border: 0; background: none; padding: 4px 0; color: var(--brand); font-weight: 700; font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 지난 설교 시트 ---------- */
.sheet {
  width: min(560px, 100vw); max-height: min(80vh, 760px); margin: auto auto 0; padding: 0;
  border: 0; border-radius: 24px 24px 0 0; background: var(--paper); color: var(--ink);
  box-shadow: 0 -10px 50px rgb(0 0 0 / 25%);
}
.sheet[open] { display: flex; flex-direction: column; animation: sheet-up .28s ease; }
@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet::backdrop { background: rgb(20 16 12 / 45%); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; }
.sheet-head h2 { margin: 0; font: 800 1.25rem/1.4 var(--serif); }
.sheet-close { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--paper-3); font-size: 1.4rem; line-height: 1; }
.sheet-body { overflow: auto; padding: 0 20px calc(20px + var(--safe-b)); }
@media (min-width: 700px) { .sheet { margin: auto; border-radius: 24px; } }

/* ---------- 토스트 · 축하 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); z-index: 80;
  max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 14px;
  background: #2a231d; color: #fff; font-size: .9375rem; text-align: center;
  opacity: 0; transform: translate(-50%, 10px); pointer-events: none; transition: .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.celebrate { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: rgb(20 16 12 / 55%); animation: fade .3s; }
.celebrate-card { width: min(400px, 100%); padding: 30px 24px 22px; border-radius: 26px; background: var(--paper-2); text-align: center; box-shadow: var(--shadow); }
.celebrate-mark { display: grid; place-items: center; width: 64px; height: 64px; margin: 14px auto; border-radius: 50%; background: var(--brand); color: var(--on-brand); }
.celebrate-mark svg { width: 30px; height: 30px; stroke-width: 3; }
.celebrate-card h2 { margin: 0 0 8px; font: 800 1.5rem/1.4 var(--serif); }
.celebrate-card p { margin: 0; color: var(--ink-2); }
.celebrate-card .eyebrow { color: var(--gold); }
.celebrate-actions { display: grid; gap: 8px; margin-top: 22px; }

/* ---------- 넓은 화면 ---------- */
@media (min-width: 900px) {

}
@media (max-width: 380px) {

@media (prefers-reduced-motion: reduce) {

@media print {

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function icon(name) { return icons[name] || ""; }

// subtitle 앞부분("10.19 월요일 ...")과 weekId 연도로 각 묵상의 실제 날짜를 계산합니다.
function dayDate(devotion) {
  const token = (devotion.subtitle || "").trim().split(/\s+/)[0] || "";
  const match = token.match(/^(\d{1,2})\.(\d{1,2})$/);
  if (!match) return null;
  const [weekYear, weekMonth] = weeklyContent.weekId.split("-").map(Number);
  const month = Number(match[1]);
  const day = Number(match[2]);
  const year = month < weekMonth ? weekYear + 1 : weekYear;
  return new Date(year, month - 1, day);
}
function ymd(date) { return date.getFullYear() + "-" + date.getMonth() + "-" + date.getDate(); }
const todayKey = ymd(new Date());
const todayIndex = devotions.findIndex((item) => { const d = dayDate(item); return d && ymd(d) === todayKey; });

const state = {
  selected: hasQueryDay ? queryDay : todayIndex >= 0 ? todayIndex : Number.isInteger(saved.selected) ? saved.selected : 0,
  view: hasQueryDay ? "detail" : "list",
  completed: new Set(saved.completed || []),
  entries: saved.entries || {}
};

function readState() {
  try { return JSON.parse(localStorage.getItem(storageKey)) || {}; } catch (e) { return {}; }
}
function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ selected: state.selected, completed: [...state.completed], entries: state.entries }));
  } catch (e) { /* 저장 공간을 쓸 수 없는 환경 */ }
}

function themeText(d) {
  return [d.title, d.subtitle, d.reference, d.verse, d.reading, d.prayer, d.action].concat(d.prompts || []).join(" ");
}
function scoreTheme(text, theme) {
  return theme.keywords.reduce((s, k) => (text.includes(k) ? s + Math.max(2, Math.min(k.length, 6)) : s), 0);
}
function autoMediaFor(devotion, index) {
  const text = themeText(devotion);
  const best = mediaThemes.map((theme) => ({ theme, score: scoreTheme(text, theme) })).sort((a, b) => b.score - a.score)[0];
  const fallback = best && best.score > 0 ? best.theme : mediaThemes[(index || 0) % mediaThemes.length];
  return { image: devotion.image || fallback.image, accent: devotion.accent || fallback.accent };
}
function metaFor(devotion, index) {
  const i = index === undefined ? devotions.indexOf(devotion) : index;
  const parts = (devotion.subtitle || "").split(" · ");
  const date = parts[0] || "";
  const navTitle = parts[1] || "말씀 묵상";
  const dayShort = (date.split(/\s+/)[1] || "").replace("요일", "");
  const dayNum = (date.split(/\s+/)[0] || "").split(".")[1] || "";
  return { date, navTitle, dayShort, dayNum, media: autoMediaFor(devotion, Math.max(0, i)) };
}
// 큰 사진(1536px PNG) 대신 쓰는 가벼운 사진. 없으면 원본으로 돌아갑니다.
function thumbOf(image) {
  return /\/generated\/[^/]+\.png$/.test(image) ? image.replace("/generated/", "/thumbs/").replace(/\.png$/, ".jpg") : image;
}
function picture(image, alt, cls, eager) {
  const small = thumbOf(image);
  return '<img class="' + (cls || "") + '" src="' + esc(small) + '" data-full="' + esc(image) + '" alt="' + esc(alt || "") + '"' +
    (eager ? ' fetchpriority="high"' : ' loading="lazy"') + ' decoding="async" onerror="if(this.src.indexOf(this.dataset.full)<0){this.src=this.dataset.full}" />';
}
function familyQuestionFor(devotion) {
  if (devotion.familyQuestion) return devotion.familyQuestion;
  const text = devotion.title + " " + devotion.reading + " " + devotion.action;
  const matches = [
    { keywords: ["원수", "사랑", "선대", "미움"], question: "우리 가족이 이번 주 더 넓은 사랑으로 품어야 할 사람은 누구일까요?" },
    { keywords: ["축복", "저주", "입술", "모욕"], question: "우리 가정의 말이 축복이 되려면 오늘 어떤 표현을 바꾸면 좋을까요?" },
    { keywords: ["들보", "판단", "정한 마음", "성찰"], question: "가족 안에서 서로를 판단하기 전에 먼저 돌아볼 내 모습은 무엇일까요?" },
    { keywords: ["규정", "사람", "고통", "회복", "필요"], question: "우리 가족이 오늘 한 사람의 필요를 살피고 도울 수 있는 작은 일은 무엇일까요?" },
    { keywords: ["말씀", "반석", "순종", "준행", "실천"], question: "오늘 말씀을 우리 집에서 함께 실천한다면 어떤 한 가지를 시작할 수 있을까요?" },
    { keywords: ["기도", "성령", "인도"], question: "우리 가족이 함께 기도로 주님께 맡겨야 할 일은 무엇일까요?" }
  ];
  const found = matches.find((m) => m.keywords.some((k) => text.includes(k)));
  return found ? found.question : "오늘 말씀을 우리 가족의 말과 행동으로 어떻게 실천할 수 있을까요?";
}

function currentArchiveEntry() {
  return { weekId: weeklyContent.weekId, sermonDate: weeklyContent.sermonDate, themeTitle: weeklyContent.themeTitle, passage: weeklyContent.passage, href: "./index.html" };
}
function normalizeArchive(entries) {
  const byWeek = new Map();
  [currentArchiveEntry()].concat(Array.isArray(entries) ? entries : []).forEach((entry) => {
    if (!entry || !entry.weekId) return;
    byWeek.set(entry.weekId, {
      weekId: entry.weekId,
      sermonDate: entry.sermonDate || entry.weekId,
      themeTitle: entry.themeTitle || "주일 말씀 묵상",
      passage: entry.passage || "",
      href: entry.href || (entry.weekId === weeklyContent.weekId ? "./index.html" : "./archive/" + entry.weekId + ".html")
    });
  });
  return [...byWeek.values()].sort((a, b) => b.weekId.localeCompare(a.weekId));
}
function shortDate(weekId) {
  const p = weekId.split("-").map(Number);
  return p[1] + "." + p[2];
}
function archiveRow(entry, cls) {
  const current = entry.weekId === weeklyContent.weekId;
  return '<a class="' + cls + (current ? " current" : "") + '" href="' + esc(entry.href) + '"' + (current ? ' aria-current="page"' : "") + ">" +
    "<small>" + esc(shortDate(entry.weekId)) + "</small><strong>" + esc(entry.themeTitle) + "</strong><span>" + esc(entry.passage) + "</span></a>";
}
function renderArchivePanel() {
  const list = document.querySelector("#archive-list");
  if (list) list.innerHTML = archiveEntries.map((e) => archiveRow(e, "archive-item")).join("");
}

  "</button>";
}

// 유튜브 ID 추출 (전체 URL 또는 ID 모두 허용)
function parseYouTubeId(value) {
  if (!value) return "";
  const text = String(value).trim();
  if (/^[\w-]{11}$/.test(text)) return text;
  const match = text.match(/(?:youtu\.be\/|v=|\/embed\/|\/live\/|\/shorts\/)([\w-]{11})/);
  return match ? match[1] : "";
}
// "12:30", "1:02:03", 750 → 초
function toSeconds(value) {
  if (value === null || value === undefined || value === "") return 0;
  if (typeof value === "number") return Math.max(0, Math.floor(value));
  const parts = String(value).trim().split(":").map(Number);
  if (parts.some((n) => Number.isNaN(n))) return 0;
  return parts.reduce((t, n) => t * 60 + n, 0);
}
function clock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function clipInfo(devotion) {
  const video = devotion.video;
  if (!video) return null;
  const id = parseYouTubeId(video.id || weeklyContent.sermonVideo);
  if (!id) return null;
  const start = toSeconds(video.start), end = toSeconds(video.end);
  const params = new URLSearchParams({ rel: "0", modestbranding: "1", playsinline: "1", autoplay: "1" });
  if (start > 0) params.set("start", String(start));
  if (end > start) params.set("end", String(end));
  return { id, start, end, src: "https://www.youtube.com/embed/" + id + "?" + params.toString() };
}
function renderClip(devotion) {
  const c = clipInfo(devotion);
  if (!c) return "";
  const minutes = c.end > c.start ? Math.max(1, Math.round((c.end - c.start) / 60)) : 0;
  return '<section class="clip"><h2 class="block-title">설교 다시 듣기</h2>' +
    '<button class="clip-btn" type="button" data-action="play" aria-label="이 본문 설교 구간 재생">' +
      '<img src="https://i.ytimg.com/vi/' + esc(c.id) + '/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()" />' +
      '<span class="play"><i>' + icon("play") + "</i><b>오늘 본문 설교 구간 보기</b><small>" + clock(c.start) + (c.end > c.start ? " – " + clock(c.end) + " · 약 " + minutes + "분" : "부터") + "</small></span>" +
    "</button></section>";
}

  state.selected = (index + devotions.length) % devotions.length;

}
function openList() {
  state.view = "list";

}
function moveDetail(direction) {

}
function ask(question, extra) {
  if (typeof window.openSermonAssistant === "function") window.openSermonAssistant(Object.assign({ question: question }, extra || {}));
}

$app.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  const ds = button.dataset;
  if (ds.open) return openDetail(Number(ds.open));
  if (ds.ask !== undefined) return ask(ds.ask, { autoSend: Boolean(ds.ask) });
  if (ds.askDay !== undefined) return ask("", { day: Number(ds.askDay), placeholder: "예) 직장에서 억울한 일이 있었어요. 오늘 말씀을 어떻게 붙들 수 있을까요?" });
  if (ds.action === "archive") return openArchive();
  if (ds.action === "install") return startInstall();
  if (ds.action === "install-dismiss") { try { localStorage.setItem(installKey, String(Date.now())); } catch (e) { /* 무시 */ } render(""); return; }
  if (ds.action === "previous") return moveDetail(-1);
  if (ds.action === "next") return moveDetail(1);
  if (ds.action === "listen") return toggleListen(button);
  if (ds.action === "share") return shareVerse();
  if (ds.action === "play") {
    const c = clipInfo(devotions[state.selected]);
    if (!c) return;
    const frame = document.createElement("iframe");
    frame.src = c.src;
    frame.title = "설교 영상";
    frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    button.replaceWith(frame);
    return;
  }
  if (ds.action === "complete-day") {
    const id = devotions[state.selected].id;
    const wasAllDone = devotions.every((d) => state.completed.has(d.id));
    if (state.completed.has(id)) state.completed.delete(id); else state.completed.add(id);
    persist();
    const isAllDone = devotions.every((d) => state.completed.has(d.id));
    const y = window.scrollY;
    render("");
    window.scrollTo(0, y);
    if (isAllDone && !wasAllDone) showCelebration();
    else if (state.completed.has(id)) toast("오늘의 묵상을 마쳤어요. 은혜로운 하루 되세요.");
    return;
  }
  if (ds.promptIndex) {
    const devotion = devotions[state.selected];
    const prompt = devotion.prompts[Number(ds.promptIndex) + 1];
    const area = document.querySelector("#journal-entry");
    const current = area ? area.value : state.entries[devotion.id] || "";
    const next = current.includes(prompt) ? current : current + (current ? "\n" : "") + prompt + " : ";
    state.entries[devotion.id] = next;
    persist();
    if (area) { area.value = next; area.focus(); area.setSelectionRange(next.length, next.length); }
  }
});

});

// ----- 토스트 · 공유 · 듣기 -----
let toastTimer;
function toast(message) {
  const el = document.querySelector("#toast");
  if (!el) return;
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}
function pageUrl(day) {
  const base = location.origin + location.pathname;
  return Number.isInteger(day) ? base + "?day=" + day : base;
}
async function shareOut(text, url) {
  if (navigator.share) {
    try { await navigator.share(url ? { text, url } : { text }); } catch (e) { /* 공유 취소 */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url ? text + "\n" + url : text);
    toast("복사되었습니다. 카카오톡에 붙여넣어 나눠 보세요.");
  } catch (e) {
    toast("복사가 지원되지 않는 환경이에요.");
  }
}
function shareVerse() {
  const d = devotions[state.selected];
  shareOut("“" + d.verse + "”\n(" + d.reference + ")\n\n" + weeklyContent.themeTitle, pageUrl(state.selected));
}
function setListenLabel(button, speaking) {
  button.innerHTML = speaking ? icon("stop") + " 그만 듣기" : icon("speaker") + " 말씀 듣기";
}
function toggleListen(button) {
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === "undefined") { toast("이 브라우저에서는 음성 듣기를 지원하지 않아요."); return; }
  if (synth.speaking) { synth.cancel(); setListenLabel(button, false); return; }
  const d = devotions[state.selected];
  const u = new SpeechSynthesisUtterance(d.verse + ". " + d.reading);
  u.lang = "ko-KR";
  u.rate = 0.95;
  u.onend = () => setListenLabel(button, false);
  u.onerror = () => { setListenLabel(button, false); if (inKakao) toast("카카오톡 안에서는 음성이 막힐 수 있어요. 우측 상단 ⋮ → 다른 브라우저로 열기."); };
  synth.cancel();
  synth.speak(u);
  setListenLabel(button, true);
  if (inKakao) toast("소리가 안 나오면 우측 상단 ⋮ → 다른 브라우저로 열기를 눌러 주세요.");
}
function showCelebration() {
  if (document.querySelector(".celebrate")) return;
  const wrap = document.createElement("div");

});
